name: Build Android APK (Google ML Kit)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Record Diagnostic Files
        if: always()
        run: |
          find . -maxdepth 6 > all_files.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-debug
          git add -f gradle_build.log all_files.txt
          git commit -m "chore: save build log and file tree" || true
          git push -f origin build-debug || true

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp -v "$APK_FILE" dist/yazio-next.apk
            ls -lh dist/yazio-next.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yazio-next-apk
          path: dist/yazio-next.apk
          retention-days: 14

      - name: Publish to GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "YAZIO-Next Android APK (v1.0.0)"
          body: |
            🤖 **YAZIO-Next Native Android APK**
            - Встроен аппаратный лазерный сканер **Google Play Code Scanner (ML Kit)**
            - Высокая скорость считывания (0.05 сек), автофокус, автозум и фонарик
            - Подключено напрямую к облачному серверу `https://yazio-next.onrender.com`
          files: dist/yazio-next.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
