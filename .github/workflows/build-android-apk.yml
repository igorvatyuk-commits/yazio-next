name: Build Android APK (Google ML Kit)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/yazio-next.apk
          ls -lh dist/yazio-next.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yazio-next-apk
          path: dist/yazio-next.apk
          retention-days: 14

      - name: Publish to GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "YAZIO-Next Android APK (v1.0.0)"
          body: |
            🤖 **YAZIO-Next Native Android APK**
            - Встроен аппаратный лазерный сканер **Google Play Code Scanner (ML Kit)**
            - Высокая скорость считывания (0.05 сек), автофокус, автозум и фонарик
            - Подключено напрямую к облачному серверу `https://yazio-next.onrender.com`
          files: dist/yazio-next.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
