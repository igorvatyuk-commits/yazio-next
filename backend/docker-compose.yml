version: '3.8'

services:
  yazio-backend:
    build: .
    container_name: yazio_next_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Required: secret token for the paywall control panel (/api/admin/*)
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env before starting}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./yazio_next.db:/app/yazio_next.db
      # Paywall switches live outside the container so changes survive redeploys.
      # Mount the directory (not the single file) so atomic config writes work.
      - ./app/config:/app/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
